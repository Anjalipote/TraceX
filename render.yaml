# ==============================================================================
# TraceX Forensic Platform — Render Blueprint (Free Tier Compatible)
# ==============================================================================

databases:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Free Tier Managed Relational Database)
  # ----------------------------------------------------------------------------
  - name: tracex-postgres
    databaseName: tracex_db
    user: tracex_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # ----------------------------------------------------------------------------
  # 1. TraceX FastAPI Forensic Backend Engine (Free Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: tracex-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracex-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_SIZE
        value: "52428800"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # ----------------------------------------------------------------------------
  # 2. TraceX React Forensic Dashboard Frontend (Free Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: tracex-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # Proxy all API requests to the backend service
      - type: rewrite
        source: /api/*
        destination: https://tracex-backend.onrender.com/api/*
      # Single Page Application (SPA) routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
