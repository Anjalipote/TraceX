version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database Service (Production Relational Store)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: tracex-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracex_secure_db_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tracex_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. TraceX FastAPI Backend Engine
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracex-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:tracex_secure_db_password_2026@db:5432/tracex_db}
      JWT_SECRET: ${JWT_SECRET:-tracex-production-secret-encryption-key-8491028491023}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: 52428800
      ENVIRONMENT: production
      BACKEND_CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/uploads
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  # ============================================================================
  # 3. TraceX Frontend (Production Multi-Stage Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tracex-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  evidence_storage:
    driver: local
